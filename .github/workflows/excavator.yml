name: Excavator

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  excavator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Scoop
        uses: MinoruSekine/setup-scoop@v4
        with:
          scoop_update: 'true'

      - name: Update Manifests
        shell: pwsh
        run: |
          $checkver = Join-Path (scoop prefix scoop) "bin\checkver.ps1"
          # checkver reports problems as ERROR lines but still exits 0, so fail on them here.
          $output = & $checkver lemonup -Dir bucket -u *>&1 | Out-String
          Write-Output $output
          if ($output -match '(?m)^ERROR') { exit 1 }

          # Clean up any side-effect files created by scoop tools
          if (Test-Path "install.ps1") { Remove-Item "install.ps1" -Force }

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Only add manifest changes that belong in this bucket.
          git add bucket/lemonup.json

          # git diff --quiet reports through its exit code, not its output.
          git diff --cached --quiet --exit-code -- bucket/lemonup.json
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update manifests"
            git pull --rebase
            git push
          }
